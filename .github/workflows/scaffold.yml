name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 에이전트가 특정 브랜치나 commit에서 파일 시스템별 전체 검증을 포함한 모든 검사를 명시적으로 돌린다
  # (`gh workflow run CI --ref <branch> [-f sha=<40자 SHA>]`). 모든 checkout이 `inputs.sha`를 받는다.
  workflow_dispatch:
    inputs:
      sha:
        description: 검증할 commit의 40자 SHA. 비우면 --ref 브랜치의 최신 commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 바뀐 파일이 Markdown뿐이면 문서 검사(check)만 실제로 돌린다. 나머지 job은 이름을 유지한 채 바로 성공한다.
  # 파일 읽기 경계에 닿는 변경이면 파일 시스템별 전체 검증(`files / …`)도 돈다(scripts/ci-changes.mjs).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      files: ${{ steps.diff.outputs.files }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      # 짧은 SHA·브랜치 이름을 주면 checkout이 다른 commit을 받을 수 있다. 지정한 그 commit이 아니면 모든 job을 막는다.
      - if: inputs.sha != ''
        env:
          SHA: ${{ inputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SHA" ]; then
            echo "::error::checked out $head, not '$SHA' (give the full 40-character commit SHA)"
            exit 1
          fi
          echo "Verifying commit $SHA"
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/ci-changes.mjs --full | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" HEAD | node scripts/ci-changes.mjs | tee -a "$GITHUB_OUTPUT"
          fi
  check:
    name: ci / ${{ matrix.script }}
    needs: changes
    # 로컬 개발 환경과 같은 Ubuntu LTS를 사용하고 OS 판 변경은 별도로 검증한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script: [check, typecheck, lint, build, "test:e2e"]
    env:
      RUN: ${{ matrix.script == 'check' || needs.changes.outputs.code == 'true' }}
    steps:
      - if: env.RUN != 'true'
        run: echo "Markdown만 바뀌어 ${{ matrix.script }}를 건너뜁니다."
      - if: env.RUN == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - if: env.RUN == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - if: env.RUN == 'true'
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        if: env.RUN == 'true' && matrix.script == 'test:e2e'
        run: pnpm --filter @babojubot/web exec playwright install --with-deps chromium
      - if: env.RUN == 'true'
        run: pnpm run ${{ matrix.script }}
      - name: Keep failed E2E traces
        if: failure() && env.RUN == 'true' && matrix.script == 'test:e2e'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
  # 테스트는 서로 독립인 다섯 job으로 나눠 겹쳐 돌린다. 코드가 바뀐 PR은 다섯 job이 모두 성공해야 한다.
  test-unit:
    name: tests / unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm --filter @babojubot/contracts --filter @babojubot/core --filter @babojubot/web run test
  test-runtime:
    name: tests / runtime
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run runtime tests
        run: pnpm --filter @babojubot/runtime run test
  test-db:
    name: tests / db
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run DB tests
        run: pnpm --filter @babojubot/db run test
      # DB 테스트가 실패 코드를 0으로 덮어쓰지 않는지, 실패한 서버 테스트와 실패한 DB 준비도 실패로 끝나는지 본다.
      - name: Check test exit codes
        run: node scripts/check-test-exit-code.mjs
      - name: Check boot script isolation
        run: node --test scripts/boot-check-flow.test.mjs scripts/boot-check.test.mjs
  test-server:
    name: tests / server
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run server tests
        run: pnpm --filter @babojubot/server exec vitest run --exclude test/opencode-real-cli.test.ts
  test-opencode:
    name: tests / opencode
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 실제 OpenCode CLI + 이 컴퓨터의 가짜 모델 검사(apps/server/test/opencode-real-cli.test.ts)용. 모델 호출·로그인은 없다.
      # 공식 설치 스크립트와 npm은 1.x라 GitHub 릴리스 묶음을 받는다(docker/runner와 같은 방식). 판은 #147 프로토콜 기준이다.
      - name: Install OpenCode
        env:
          OPENCODE_VERSION: "2.2.6"
        run: |
          mkdir -p "$RUNNER_TEMP/opencode"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/opencode" opencode
          "$RUNNER_TEMP/opencode/opencode" --version
          echo "BABOJUBOT_TEST_OPENCODE=$RUNNER_TEMP/opencode/opencode" >> "$GITHUB_ENV"
      - name: Run real OpenCode CLI tests
        run: pnpm --filter @babojubot/server exec vitest run test/opencode-real-cli.test.ts
  # 지점 보호가 기대하는 `ci / test` 이름을 유지하는 집계 job. 각 테스트 job의 성공·건너뜀·취소를 하나씩 판정한다.
  test:
    name: ci / test
    needs:
      [
        changes,
        test-unit,
        test-runtime,
        test-db,
        test-server,
        test-opencode,
        test-macos,
        test-windows,
        files-linux,
        files-windows,
        files-macos,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Check test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FILES: ${{ needs.changes.outputs.files }}
          UNIT_RESULT: ${{ needs.test-unit.result }}
          RUNTIME_RESULT: ${{ needs.test-runtime.result }}
          DB_RESULT: ${{ needs.test-db.result }}
          SERVER_RESULT: ${{ needs.test-server.result }}
          OPENCODE_RESULT: ${{ needs.test-opencode.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
          FILES_LINUX_RESULT: ${{ needs.files-linux.result }}
          FILES_WINDOWS_RESULT: ${{ needs.files-windows.result }}
          FILES_MACOS_RESULT: ${{ needs.files-macos.result }}
        run: node scripts/check-ci-test-gate.mjs
  # 실제 프로그램 연결은 세 OS를 지원한다. DB가 필요 없는 연결 검사만 돈다. 시스템마다 하나의 독립 job이며
  # `ci / test`가 각 결과를 직접 판정한다(matrix 요약은 개별 실패를 가릴 수 있다). 두 job의 단계는 같아야 한다(scripts/ci-test-gate.test.mjs).
  test-macos:
    name: runtime on macos-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 집계 판정과 그 회귀 검사가 Bash 없이 이 시스템의 Node에서도 도는지 본다. PATH를 비운 검사도 포함한다.
      - name: Check CI gate portability
        run: node --test scripts/ci-test-gate.test.mjs
      - run: pnpm --filter @babojubot/runtime run typecheck
      - run: pnpm --filter @babojubot/runtime test
      # 조직 경계의 파일 읽기는 시스템마다 파일 식별이 달라 실제로 돌려 본다. 파일 시스템별 전체 검증이 도는 변경이면
      # 그 job이 이 시스템의 기본 볼륨을 포함해 같은 시험을 돌므로 여기서는 거듭하지 않는다.
      - if: needs.changes.outputs.files != 'true'
        run: pnpm --filter @babojubot/server exec vitest run --config vitest.files.config.ts
      # 기본 설정의 서버가 이 시스템에서 실제로 뜨는지 본다. 내장 DB와 migration, 강제 종료 뒤 남은 DB의 정상 정지까지 포함한다.
      # 내장 DB는 pg_ctl로 켜므로 Windows CI의 관리자 계정에서도 뜬다. 부모 설정 격리와 시한에서의 정리(Windows는 taskkill
      # 분기와 쓰는 중인 파일, 대소문자를 가리지 않는 환경 변수)도 이 시스템에서 확인한다.
      - name: Check boot script on this system
        run: node --test scripts/boot-check-flow.test.mjs scripts/boot-check.test.mjs
  test-windows:
    name: runtime on windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 집계 판정과 그 회귀 검사가 Bash 없이 이 시스템의 Node에서도 도는지 본다. PATH를 비운 검사도 포함한다.
      - name: Check CI gate portability
        run: node --test scripts/ci-test-gate.test.mjs
      - run: pnpm --filter @babojubot/runtime run typecheck
      - run: pnpm --filter @babojubot/runtime test
      # 조직 경계의 파일 읽기는 시스템마다 파일 식별이 달라 실제로 돌려 본다. 파일 시스템별 전체 검증이 도는 변경이면
      # 그 job이 이 시스템의 기본 볼륨을 포함해 같은 시험을 돌므로 여기서는 거듭하지 않는다.
      - if: needs.changes.outputs.files != 'true'
        run: pnpm --filter @babojubot/server exec vitest run --config vitest.files.config.ts
      # 기본 설정의 서버가 이 시스템에서 실제로 뜨는지 본다. 내장 DB와 migration, 강제 종료 뒤 남은 DB의 정상 정지까지 포함한다.
      # 내장 DB는 pg_ctl로 켜므로 Windows CI의 관리자 계정에서도 뜬다. 부모 설정 격리와 시한에서의 정리(Windows는 taskkill
      # 분기와 쓰는 중인 파일, 대소문자를 가리지 않는 환경 변수)도 이 시스템에서 확인한다.
      - name: Check boot script on this system
        run: node --test scripts/boot-check-flow.test.mjs scripts/boot-check.test.mjs
  # 파일 시스템별 전체 검증(#153). 조직 경계의 파일 읽기에 닿는 변경(scripts/ci-changes.mjs)과 수동 실행에서만 돈다.
  # OS마다 job 하나가 시험용 볼륨을 한 번 준비하고 볼륨마다 같은 시험(apps/server/vitest.files.config.ts)을 돈다.
  # 앞 볼륨이 실패해도 남은 볼륨·결과표·정리는 돌고(`!cancelled()`·`always()`), job은 실패로 남는다.
  # 결과표(C01–C37, F1–F6)는 job 요약과 `file-boundary-*` artifact에 남는다.
  files-linux:
    name: files / linux
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 장치 노드 시험(C18)은 sudo로 만들고 일반 사용자로 읽는다.
      - name: Prepare volumes
        timeout-minutes: 3
        run: |
          dir="$RUNNER_TEMP/file-volumes/ext4"
          mkdir -p "$dir"
          findmnt -T "$dir"
          [ "$(findmnt -n -o FSTYPE -T "$dir")" = ext4 ] || { echo "::error::$dir is not on ext4"; exit 1; }
          id
          sudo -n true
          echo "FILES_EXT4=$dir" >> "$GITHUB_ENV"
      - name: Check ext4
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume ext4 --fs ext4 --dir "$FILES_EXT4" --case sensitive --nfd sensitive
      - name: Report
        if: ${{ !cancelled() }}
        run: node scripts/file-boundary-report.mjs --require ext4
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: file-boundary-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: file-boundary-reports/
          if-no-files-found: warn
          retention-days: 14
  files-windows:
    name: files / windows
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Prepare volumes
        timeout-minutes: 5
        run: ./scripts/files/prepare-windows.ps1
      - name: Check NTFS
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume NTFS --fs NTFS --dir "$env:FILES_NTFS" --case insensitive --nfd sensitive
      - name: Check FAT32
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume FAT32 --fs FAT32 --dir "$env:FILES_FAT32" --case insensitive --nfd sensitive
      - name: Check SMB loopback
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume SMB --fs "SMB $env:FILES_SMB_DIALECT loopback to NTFS" --dir "$env:FILES_SMB" --case insensitive --nfd sensitive
      - name: Report
        if: ${{ !cancelled() }}
        run: node scripts/file-boundary-report.mjs --require NTFS,FAT32,SMB
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: file-boundary-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: file-boundary-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up volumes
        if: always()
        timeout-minutes: 3
        run: ./scripts/files/cleanup-windows.ps1
  files-macos:
    name: files / macos
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Prepare volumes
        timeout-minutes: 5
        run: ./scripts/files/prepare-macos.sh
      - name: Check APFS
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume APFS --fs APFS --dir "$FILES_APFS" --case insensitive --nfd insensitive
      - name: Check case-sensitive APFS
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume APFS-CS --fs "Case-sensitive APFS" --dir "$FILES_APFSX" --case sensitive --nfd insensitive
      - name: Check HFS+
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume HFS --fs "HFS+" --dir "$FILES_HFS" --case insensitive --nfd insensitive
      - name: Check case-sensitive HFS+
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume HFSX --fs "Case-sensitive HFS+" --dir "$FILES_HFSX" --case sensitive --nfd insensitive
      - name: Report
        if: ${{ !cancelled() }}
        run: node scripts/file-boundary-report.mjs --require APFS,APFS-CS,HFS,HFSX
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: file-boundary-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: file-boundary-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up volumes
        if: always()
        timeout-minutes: 3
        run: ./scripts/files/cleanup-macos.sh
