name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 에이전트가 특정 브랜치나 commit에서 파일 시스템별 전체 검증을 포함한 모든 검사를 명시적으로 돌린다
  # (`gh workflow run CI --ref <branch> [-f sha=<40자 SHA>]`). 모든 checkout이 `inputs.sha`를 받는다.
  workflow_dispatch:
    inputs:
      sha:
        description: 검증할 commit의 40자 SHA. 비우면 --ref 브랜치의 최신 commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 바뀐 파일이 Markdown뿐이면 문서 검사(check)만 실제로 돌린다. 나머지 job은 이름을 유지한 채 바로 성공한다.
  # 파일 읽기 경계에 닿는 변경이면 파일 시스템별 전체 검증(`files / …`)도 돈다(scripts/ci-changes.mjs).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      files: ${{ steps.diff.outputs.files }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      # 짧은 SHA·브랜치 이름을 주면 checkout이 다른 commit을 받을 수 있다. 지정한 그 commit이 아니면 모든 job을 막는다.
      - if: inputs.sha != ''
        env:
          SHA: ${{ inputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SHA" ]; then
            echo "::error::checked out $head, not '$SHA' (give the full 40-character commit SHA)"
            exit 1
          fi
          echo "Verifying commit $SHA"
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/ci-changes.mjs --full | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" HEAD | node scripts/ci-changes.mjs | tee -a "$GITHUB_OUTPUT"
          fi
  check:
    name: ci / ${{ matrix.script }}
    needs: changes
    # 로컬 개발 환경과 같은 Ubuntu LTS를 사용하고 OS 판 변경은 별도로 검증한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script: [check, typecheck, lint, build, "test:e2e"]
    env:
      RUN: ${{ matrix.script == 'check' || needs.changes.outputs.code == 'true' }}
    steps:
      - if: env.RUN != 'true'
        run: echo "Markdown만 바뀌어 ${{ matrix.script }}를 건너뜁니다."
      - if: env.RUN == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - if: env.RUN == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - if: env.RUN == 'true'
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile
      # Playwright는 브라우저 내려받기를 스스로 5번까지 시도하고 실패한 시도의 파일을 지운다(playwright-core
      # downloadBrowserWithProgressBar). 시스템 의존성은 apt가 받으므로 apt의 받기 재시도만 켠다(아래 단계).
      # 느린 미러에서는 설치가 8분 넘게 걸린 적이 있다(최근 35회 최대 511초). 그래서 설치 단계 시한을 12분으로 둔다.
      - name: Let apt retry transient download failures
        if: env.RUN == 'true' && matrix.script == 'test:e2e'
        run: echo 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/zzz-babojubot-retries
      - name: Install Chromium and system dependencies
        if: env.RUN == 'true' && matrix.script == 'test:e2e'
        timeout-minutes: 12
        # 시도마다 번호와 오류를 로그에 남긴다.
        env:
          DEBUG: pw:install
        run: pnpm --filter @babojubot/web exec playwright install --with-deps chromium
      - if: env.RUN == 'true' && matrix.script != 'test:e2e'
        run: pnpm run ${{ matrix.script }}
      # 시험 실행인 E2E만 단계 시한을 둔다(#218). 문서 검사·타입·lint·빌드는 job 시한만 받는다.
      - name: Run E2E
        if: env.RUN == 'true' && matrix.script == 'test:e2e'
        timeout-minutes: 12
        run: pnpm run test:e2e
      # 통과·실패·건너뜀 수를 남기고, 예상 밖 건너뜀과 빠진 서버 수명 시험을 실패로 본다.
      - name: Check E2E report
        if: ${{ !cancelled() && env.RUN == 'true' && matrix.script == 'test:e2e' }}
        run: node scripts/check-e2e-report.mjs apps/web/test-results/e2e-report.json
      - name: Keep failed E2E traces
        if: failure() && env.RUN == 'true' && matrix.script == 'test:e2e'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
  # 테스트는 서로 독립인 다섯 job으로 나눠 겹쳐 돌린다. 코드가 바뀐 PR은 다섯 job이 모두 성공해야 한다.
  test-unit:
    name: tests / unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        timeout-minutes: 12
        run: pnpm --filter @babojubot/contracts --filter @babojubot/core --filter @babojubot/web run test
  test-runtime:
    name: tests / runtime
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 링크를 모르는 실제 디스크(vfat)를 loop로 붙인다. 격리 실행의 인증 중계 시험(#209)이 거기에 데이터 폴더를 두고 모의 없이 돈다.
      - name: Prepare a disk that refuses links
        timeout-minutes: 3
        run: |
          img="$RUNNER_TEMP/no-links.img"
          dir="$RUNNER_TEMP/no-links"
          # apt의 받기 재시도는 시간 초과·연결 실패 같은 일시적인 오류에만 걸린다. 잘못된 패키지 이름·404는 바로 실패한다.
          echo 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/zzz-babojubot-retries
          command -v mkfs.vfat >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q dosfstools; }
          truncate -s 64M "$img"
          mkfs.vfat "$img"
          mkdir -p "$dir"
          sudo mount -o "loop,uid=$(id -u),gid=$(id -g),umask=077" "$img" "$dir"
          [ "$(findmnt -n -o FSTYPE -T "$dir")" = vfat ] || { echo "::error::$dir is not on vfat"; exit 1; }
          echo "BABOJUBOT_TEST_NO_LINK_DIR=$dir" >> "$GITHUB_ENV"
      - name: Run runtime tests
        timeout-minutes: 12
        # 바깥 환경이 필요한 시험은 이 job에서 필수다. 확인이 실패하면 건너뛰지 않고 원인과 함께 실패한다(test-support.ts probeEnvironment):
        # 실제 Docker 격리(container.docker.test.ts), python pty 실제 터미널(login.test.ts), systemd 사용자 scope(lease-hidden.alone.test.ts).
        env:
          BABOJUBOT_REQUIRE_DOCKER: "1"
          BABOJUBOT_REQUIRE_PYTHON_PTY: "1"
          BABOJUBOT_REQUIRE_SYSTEMD_SCOPE: "1"
        run: pnpm --filter @babojubot/runtime run test
  test-db:
    name: tests / db
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run DB tests
        timeout-minutes: 7
        run: pnpm --filter @babojubot/db run test
      # DB 테스트가 실패 코드를 0으로 덮어쓰지 않는지, 실패한 서버 테스트와 실패한 DB 준비도 실패로 끝나는지 본다.
      - name: Check test exit codes
        timeout-minutes: 3
        run: node scripts/check-test-exit-code.mjs
      - name: Check boot script isolation
        timeout-minutes: 5
        run: node --test scripts/boot-check-flow.test.mjs scripts/boot-check.test.mjs
  test-server:
    name: tests / server
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run server tests
        timeout-minutes: 12
        run: pnpm --filter @babojubot/server exec vitest run --exclude test/opencode-real-cli.test.ts
  test-opencode:
    name: tests / opencode
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 실제 OpenCode CLI + 이 컴퓨터의 가짜 모델 검사(apps/server/test/opencode-real-cli.test.ts)용. 모델 호출·로그인은 없다.
      # 공식 설치 스크립트와 npm은 1.x라 GitHub 릴리스 묶음을 받는다(docker/runner와 같은 방식). 판은 #147 프로토콜 기준이다.
      # 일시적인 오류(시간 초과·연결 거부·HTTP 408·429·5xx)만 두 번 더 받는다(curl --retry). 404 같은 오류는 바로 실패한다.
      # 파일로 받아야 curl이 다시 받기 전에 받다 만 내용을 버린다. 시도마다 남는 경고와 마지막 오류가 로그에 남는다.
      # 약 122MB 묶음이다. 초당 100KB 아래로 30초 멈춘 시도만 끊고, 느리게 받는 시도는 6분까지 둔다. 서버가 요구한 대기를 포함한 재시도 전체는 180초로 묶어, 그 안에 시작한 마지막 시도가 6분을 다 써도(최악 9분 반) 단계 시한 10분 안에 마지막 오류와 안내가 남는다.
      - name: Install OpenCode
        timeout-minutes: 10
        env:
          OPENCODE_VERSION: "2.2.6"
        run: |
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/opencode"
          curl -fSL --no-progress-meter --retry 2 --retry-connrefused --connect-timeout 15 --speed-limit 102400 --speed-time 30 --max-time 360 --retry-max-time 180 -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" ||
            { echo "::error::OpenCode download failed after up to 3 attempts; the last error is above"; exit 1; }
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode" opencode
          "$RUNNER_TEMP/opencode/opencode" --version
          echo "BABOJUBOT_TEST_OPENCODE=$RUNNER_TEMP/opencode/opencode" >> "$GITHUB_ENV"
      - name: Run real OpenCode CLI tests
        timeout-minutes: 10
        run: pnpm --filter @babojubot/server exec vitest run test/opencode-real-cli.test.ts
  # 지점 보호가 기대하는 `ci / test` 이름을 유지하는 집계 job. 각 테스트 job의 성공·건너뜀·취소를 하나씩 판정한다.
  # 실패한 job마다 이유(시험 실패·실행 컴퓨터 미배정·취소·알 수 없음)를 job summary 표로 남긴다. 판정은 바꾸지 않는다.
  test:
    name: ci / test
    needs:
      [
        changes,
        test-unit,
        test-runtime,
        test-db,
        test-server,
        test-opencode,
        test-macos,
        test-windows,
        test-e2e-windows-1,
        test-e2e-windows-2,
        test-e2e-windows,
        files-linux,
        files-windows,
        files-macos,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 실패 이유를 붙이려고 이번 시도의 job 기록과 주석만 읽는다. 다시 돌리는 권한(actions: write)은 두지 않는다.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Check test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FILES: ${{ needs.changes.outputs.files }}
          UNIT_RESULT: ${{ needs.test-unit.result }}
          RUNTIME_RESULT: ${{ needs.test-runtime.result }}
          DB_RESULT: ${{ needs.test-db.result }}
          SERVER_RESULT: ${{ needs.test-server.result }}
          OPENCODE_RESULT: ${{ needs.test-opencode.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
          E2E_WINDOWS_1_RESULT: ${{ needs.test-e2e-windows-1.result }}
          E2E_WINDOWS_2_RESULT: ${{ needs.test-e2e-windows-2.result }}
          E2E_WINDOWS_RESULT: ${{ needs.test-e2e-windows.result }}
          FILES_LINUX_RESULT: ${{ needs.files-linux.result }}
          FILES_WINDOWS_RESULT: ${{ needs.files-windows.result }}
          FILES_MACOS_RESULT: ${{ needs.files-macos.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-ci-test-gate.mjs
  # 실제 프로그램 연결은 세 OS를 지원한다. DB가 필요 없는 연결 검사만 돈다. 시스템마다 하나의 독립 job이며
  # `ci / test`가 각 결과를 직접 판정한다(matrix 요약은 개별 실패를 가릴 수 있다). 두 job의 단계는 같아야 한다(scripts/ci-test-gate.test.mjs).
  test-macos:
    name: runtime on macos-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 집계 판정과 그 회귀 검사가 Bash 없이 이 시스템의 Node에서도 도는지 본다. PATH를 비운 검사도 포함한다.
      - name: Check CI gate portability
        run: node --test scripts/ci-test-gate.test.mjs
      - run: pnpm --filter @babojubot/runtime run typecheck
      # python pty 실제 터미널 시험(login.test.ts)은 필수다. Windows는 POSIX pty가 없어 그 시험만 OS 이유로 건너뛴다.
      - timeout-minutes: 8
        env:
          BABOJUBOT_REQUIRE_PYTHON_PTY: "1"
        run: pnpm --filter @babojubot/runtime test
      # 조직 경계의 파일 읽기는 시스템마다 파일 식별이 달라 실제로 돌려 본다. 파일 시스템별 전체 검증이 도는 변경이면
      # 그 job이 이 시스템의 기본 볼륨을 포함해 같은 시험을 돌므로 여기서는 거듭하지 않는다.
      - if: needs.changes.outputs.files != 'true'
        timeout-minutes: 4
        run: pnpm --filter @babojubot/server exec vitest run --config vitest.files.config.ts
      # 기본 설정의 서버가 이 시스템에서 실제로 뜨는지 본다. 내장 DB와 migration, 강제 종료 뒤 남은 DB의 정상 정지까지 포함한다.
      # 내장 DB는 pg_ctl로 켜므로 Windows CI의 관리자 계정에서도 뜬다. 부모 설정 격리와 시한에서의 정리(Windows는 taskkill
      # 분기와 쓰는 중인 파일, 대소문자를 가리지 않는 환경 변수)도 이 시스템에서 확인한다.
      - name: Check boot script on this system
        timeout-minutes: 3
        run: node --test scripts/boot-check-flow.test.mjs scripts/boot-check.test.mjs
  test-windows:
    name: runtime on windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 집계 판정과 그 회귀 검사가 Bash 없이 이 시스템의 Node에서도 도는지 본다. PATH를 비운 검사도 포함한다.
      - name: Check CI gate portability
        run: node --test scripts/ci-test-gate.test.mjs
      - run: pnpm --filter @babojubot/runtime run typecheck
      # python pty 실제 터미널 시험(login.test.ts)은 필수다. Windows는 POSIX pty가 없어 그 시험만 OS 이유로 건너뛴다.
      - timeout-minutes: 8
        env:
          BABOJUBOT_REQUIRE_PYTHON_PTY: "1"
        run: pnpm --filter @babojubot/runtime test
      # 조직 경계의 파일 읽기는 시스템마다 파일 식별이 달라 실제로 돌려 본다. 파일 시스템별 전체 검증이 도는 변경이면
      # 그 job이 이 시스템의 기본 볼륨을 포함해 같은 시험을 돌므로 여기서는 거듭하지 않는다.
      - if: needs.changes.outputs.files != 'true'
        timeout-minutes: 4
        run: pnpm --filter @babojubot/server exec vitest run --config vitest.files.config.ts
      # 기본 설정의 서버가 이 시스템에서 실제로 뜨는지 본다. 내장 DB와 migration, 강제 종료 뒤 남은 DB의 정상 정지까지 포함한다.
      # 내장 DB는 pg_ctl로 켜므로 Windows CI의 관리자 계정에서도 뜬다. 부모 설정 격리와 시한에서의 정리(Windows는 taskkill
      # 분기와 쓰는 중인 파일, 대소문자를 가리지 않는 환경 변수)도 이 시스템에서 확인한다.
      - name: Check boot script on this system
        timeout-minutes: 3
        run: node --test scripts/boot-check-flow.test.mjs scripts/boot-check.test.mjs
  # Windows의 서버 정상 종료와 화면 E2E(#189). Windows에서는 부모가 신호로 서버에 정리를 맡길 수 없어 멈춤 메시지를 쓴다.
  # 서버 진입점의 멈춤 시험(POSIX 전용 신호·프로세스 그룹 시험은 건너뜀)과 Chromium 전체 E2E를 이 시스템에서 돈다.
  # 전체 시간을 줄이려고 E2E를 두 job으로 나눠(Playwright shard) 동시에 돈다. 두 job은 shard 번호와 멈춤 시험(1/2만) 말고
  # 단계가 같아야 한다(scripts/ci-test-gate.test.mjs). 각 job은 JSON 보고서를 artifact로 넘기고, 실패하면 trace도 남긴다.
  test-e2e-windows-1:
    name: e2e on windows-latest (1/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Check server stop on this system
        timeout-minutes: 5
        run: pnpm --filter @babojubot/server exec vitest run src/stop-request.test.ts test/main.test.ts
      # Playwright가 브라우저 내려받기를 스스로 5번까지 시도하고 실패한 시도의 파일을 지운다.
      - name: Install Chromium
        timeout-minutes: 5
        # 시도마다 번호와 오류를 로그에 남긴다.
        env:
          DEBUG: pw:install
        run: pnpm --filter @babojubot/web exec playwright install chromium
      - name: Run E2E
        timeout-minutes: 25
        run: pnpm --filter @babojubot/web exec playwright test --shard=1/2
      # 다시 돌린 시도(re-run)에서도 판정 job이 같은 이름으로 찾도록 시도 번호를 붙이지 않고 덮어쓴다.
      - name: Keep E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-windows-report-1
          path: apps/web/test-results/e2e-report.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3
      - name: Keep failed E2E traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-windows-failure-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
  test-e2e-windows-2:
    name: e2e on windows-latest (2/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # Playwright가 브라우저 내려받기를 스스로 5번까지 시도하고 실패한 시도의 파일을 지운다.
      - name: Install Chromium
        timeout-minutes: 5
        # 시도마다 번호와 오류를 로그에 남긴다.
        env:
          DEBUG: pw:install
        run: pnpm --filter @babojubot/web exec playwright install chromium
      - name: Run E2E
        timeout-minutes: 25
        run: pnpm --filter @babojubot/web exec playwright test --shard=2/2
      # 다시 돌린 시도(re-run)에서도 판정 job이 같은 이름으로 찾도록 시도 번호를 붙이지 않고 덮어쓴다.
      - name: Keep E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-windows-report-2
          path: apps/web/test-results/e2e-report.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3
      - name: Keep failed E2E traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-windows-failure-${{ github.run_id }}-${{ github.run_attempt }}-2
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
  # 두 shard의 보고서를 합쳐 판정한다. 결과 수를 남기고 예상 밖 건너뜀·빠진 서버 수명 시험을 실패로 본다.
  # shard가 실패해도 돌아 수를 남기고, 보고서가 빠지면 실패한다.
  test-e2e-windows:
    name: e2e on windows-latest
    needs: [changes, test-e2e-windows-1, test-e2e-windows-2]
    if: ${{ always() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Get E2E report 1/2
        uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-windows-report-1
          path: e2e-reports/1
      - name: Get E2E report 2/2
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-windows-report-2
          path: e2e-reports/2
      - name: Check E2E report
        if: ${{ !cancelled() }}
        run: node scripts/check-e2e-report.mjs e2e-reports/1/e2e-report.json e2e-reports/2/e2e-report.json
  # 파일 시스템별 전체 검증(#153). 조직 경계의 파일 읽기에 닿는 변경(scripts/ci-changes.mjs)과 수동 실행에서만 돈다.
  # OS마다 job 하나가 시험용 볼륨을 한 번 준비하고 볼륨마다 같은 시험(apps/server/vitest.files.config.ts)을 돈다.
  # 앞 볼륨이 실패해도 남은 볼륨·결과표·정리는 돌고(`!cancelled()`·`always()`), job은 실패로 남는다.
  # 결과표(C01–C37, F1–F6)는 job 요약과 `file-boundary-*` artifact에 남는다.
  files-linux:
    name: files / linux
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 장치 노드 시험(C18)은 sudo로 만들고 일반 사용자로 읽는다.
      - name: Prepare volumes
        timeout-minutes: 3
        run: |
          dir="$RUNNER_TEMP/file-volumes/ext4"
          mkdir -p "$dir"
          findmnt -T "$dir"
          [ "$(findmnt -n -o FSTYPE -T "$dir")" = ext4 ] || { echo "::error::$dir is not on ext4"; exit 1; }
          id
          sudo -n true
          echo "FILES_EXT4=$dir" >> "$GITHUB_ENV"
      - name: Check ext4
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume ext4 --fs ext4 --dir "$FILES_EXT4" --case sensitive --nfd sensitive
      - name: Report
        if: ${{ !cancelled() }}
        run: node scripts/file-boundary-report.mjs --require ext4
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: file-boundary-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: file-boundary-reports/
          if-no-files-found: warn
          retention-days: 14
  files-windows:
    name: files / windows
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Prepare volumes
        timeout-minutes: 5
        run: ./scripts/files/prepare-windows.ps1
      - name: Check NTFS
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume NTFS --fs NTFS --dir "$env:FILES_NTFS" --case insensitive --nfd sensitive
      - name: Check FAT32
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume FAT32 --fs FAT32 --dir "$env:FILES_FAT32" --case insensitive --nfd sensitive
      - name: Check SMB loopback
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume SMB --fs "SMB $env:FILES_SMB_DIALECT loopback to NTFS" --dir "$env:FILES_SMB" --case insensitive --nfd sensitive
      - name: Report
        if: ${{ !cancelled() }}
        run: node scripts/file-boundary-report.mjs --require NTFS,FAT32,SMB
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: file-boundary-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: file-boundary-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up volumes
        if: always()
        timeout-minutes: 3
        run: ./scripts/files/cleanup-windows.ps1
  files-macos:
    name: files / macos
    needs: changes
    if: needs.changes.outputs.files == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Prepare volumes
        timeout-minutes: 5
        run: ./scripts/files/prepare-macos.sh
      - name: Check APFS
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume APFS --fs APFS --dir "$FILES_APFS" --case insensitive --nfd insensitive
      - name: Check case-sensitive APFS
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume APFS-CS --fs "Case-sensitive APFS" --dir "$FILES_APFSX" --case sensitive --nfd insensitive
      - name: Check HFS+
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume HFS --fs "HFS+" --dir "$FILES_HFS" --case insensitive --nfd insensitive
      - name: Check case-sensitive HFS+
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/file-boundary-run.mjs --volume HFSX --fs "Case-sensitive HFS+" --dir "$FILES_HFSX" --case sensitive --nfd insensitive
      - name: Report
        if: ${{ !cancelled() }}
        run: node scripts/file-boundary-report.mjs --require APFS,APFS-CS,HFS,HFSX
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: file-boundary-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: file-boundary-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up volumes
        if: always()
        timeout-minutes: 3
        run: ./scripts/files/cleanup-macos.sh
