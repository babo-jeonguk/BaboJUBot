[package]
name = "babojubot-supervisor"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "babojubot-supervisor"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
